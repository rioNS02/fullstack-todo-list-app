<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/register.css" />
    <title>Register</title>
  </head>
  <body>
    <div class="container">
      <h1>Register</h1>
      <form id="login-form">
        <p class="message"></p>
        <div>
          <input
            type="text"
            id="firstname"
            name="firstname"
            placeholder="Firstname"
            required
          />
        </div>
        <div>
          <input
            type="text"
            id="lastname"
            name="lastname"
            placeholder="Lastname"
          />
        </div>
        <div>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Username"
            required
          />
        </div>
        <div>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required
          />
        </div>
        <div>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
          />
        </div>
        <button type="submit" id="submit">Sign Up</button>
      </form>
    </div>
    <script src="js/register.js"></script>
  </body>
</html>
